name: Web build (pygbag)

# Builds the WebAssembly version with pygbag and publishes it to GitHub Pages.
# One-time setup: repository Settings -> Pages -> Build and deployment ->
# Source = "GitHub Actions".  The playable URL is then
#   https://<owner>.github.io/<repo>/
#
# This job never touches the desktop run, the wheel, or the .deb.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pygbag
        run: pip install pygbag

      - name: Build (writes build/web)
        # Legacy PySyCache ships .wav sound effects; browsers play them fine, so
        # tell pygbag not to hard-fail on the format.
        run: python -m pygbag --build --disable-sound-format-error main.py

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
