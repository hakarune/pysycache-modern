name: Web (deploy to Pages)

# Builds the vanilla-JS web version and publishes web/ to GitHub Pages.
# One-time setup: Settings -> Pages -> Source = "GitHub Actions".
# Live URL: https://<owner>.github.io/<repo>/

on:
  push:
    branches: [main]
    paths: ["web/**", "assets/**", "src/games/**", "src/engine.py", ".github/workflows/web-deploy.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Generate manifests + assets
        run: node web/tools/build.mjs
      - name: Assert generated files are committed
        run: node web/tools/build.mjs --check
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
