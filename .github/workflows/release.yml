name: Release

# On a v* tag (or a manual run against an existing tag) build the
# distributables and attach them to a GitHub Release:
#   - wheel + sdist            (python -m build)
#   - standalone .deb           (build-deb.sh)
#   - web version zip           (web/tools/build.mjs + zip of web/)

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release (e.g. v0.1.0)"
        required: true

permissions:
  contents: write

jobs:
  python-dist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: dist/*

  deb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: bash build-deb.sh
      - uses: actions/upload-artifact@v4
        with:
          name: deb
          path: build/deb/out/*.deb

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node web/tools/build.mjs
      - run: node web/tools/build.mjs --check
      - name: Zip web/
        run: |
          v="${{ github.event.inputs.tag || github.ref_name }}"
          (cd web && zip -rq "$GITHUB_WORKSPACE/pysycache-modern-web-${v}.zip" . -x 'tools/*' 'README.md')
      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: pysycache-modern-web-*.zip

  publish:
    needs: [python-dist, deb, web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - run: ls -R artifacts
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: false
          files: artifacts/**/*
