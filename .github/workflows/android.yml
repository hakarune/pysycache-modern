name: Android APK (Buildozer)

# Ad-hoc debug .apk build, uploaded as a workflow artifact.
# Trigger it by hand from the Actions tab. Tagged releases build their own APK
# via release.yml, so this is only for testing between releases.
#
# A cold build takes ~30 min. This job never touches the desktop run, the
# wheel, or the .deb.

on:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build debug APK
        uses: ArtemSBulgakov/buildozer-action@v1
        with:
          command: buildozer android debug
          buildozer_version: stable

      - uses: actions/upload-artifact@v4
        with:
          name: pysycache-modern-apk
          path: bin/*.apk
          if-no-files-found: error
