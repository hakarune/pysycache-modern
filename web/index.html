<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1a3755" />
  <title>PySyCache-Modern</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./icons/icon-192.png" />
  <link rel="apple-touch-icon" href="./icons/icon-192.png" />
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <main id="stage">
    <canvas id="game" width="800" height="600" aria-label="PySyCache-Modern game"></canvas>
    <div id="boot">
      <div class="bar"><i></i></div>
      <p>Loading…</p>
    </div>
    <button id="fs" type="button" title="Fullscreen" aria-label="Toggle fullscreen">⛶</button>
    <a id="credits" href="./CREDITS.html" target="_blank" rel="noopener" title="Asset credits">ⓘ</a>
  </main>
  <script type="module" src="./js/main.js"></script>
  <script>
    // Plain (non-module) watchdog: if the module never boots, the #boot
    // spinner would otherwise sit on "Loading…" forever with no explanation.
    setTimeout(function () {
      var el = document.getElementById("boot");
      if (!el || el.classList.contains("hidden") || el.dataset.err) return;
      var msg = location.protocol === "file:"
        ? "This page must be served over http:// -- opening the index.html file directly (file://) blocks the game's scripts. Use the GitHub Pages link, or run a local web server in the web/ folder."
        : "The game didn't start. Reload; if it keeps happening, clear this site's data (an old cached version may be stuck).";
      el.innerHTML = '<p style="max-width:82vw;color:#ffb3b3;font-size:.85rem;line-height:1.4;text-align:center">' + msg + "</p>";
    }, 8000);
  </script>
</body>
</html>
